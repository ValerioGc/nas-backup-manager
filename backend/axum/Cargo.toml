[package]
name = "nas-backup-manager-axum"
version = "0.1.18"
edition = "2021"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
hex = "0.4.3"
notify = { version = "8.2.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
