sonar.projectKey=nas-backup-manager
sonar.projectName=Nas Backup Manager
sonar.projectVersion=0.9.0

sonar.sources=src,backend/src
sonar.tests=src/tests,backend/tests
sonar.exclusions=src/tests/**,**/node_modules/**,**/dist/**,**/coverage/**,src/i18n/locales/**,**/gen/**
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/types/**,**/*.d.ts
sonar.rust.lcov.reportPaths=backend/coverage/lcov.info
sonar.rust.clippy.reportPaths=backend/clippy-report.json
